services:
  db:
    image: pgvector/pgvector:pg17
    container_name: filings-rag-db
    environment:
      POSTGRES_USER: frl
      POSTGRES_PASSWORD: frl
      POSTGRES_DB: frl
    # Loopback only. 5432, 5433 and 55432 are taken by other projects on the Nucbox.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - frl-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frl -d frl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frl-pgdata:
