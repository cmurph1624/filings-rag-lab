# P0 baseline: fixed-size chunks, one shared index over all 84 filings, pure vector top-k.
name = "p0-naive"
pipeline = "naive-fixed@1"
questions = "financebench-open"
corpus = "fb-gold@1"  # the 84 question filings (the default)

[retriever]
kind = "vector"
k = 10
search = "exact"  # true top-k; "hnsw" is the approximate index

[generation]
backend = "claude-cli"
model = "claude-sonnet-5-5"
prompt = "answer@1"

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
