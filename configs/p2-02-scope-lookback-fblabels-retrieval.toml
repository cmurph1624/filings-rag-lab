# Retrieval-only (P2 PR 2): structured@1 + rules scope + rerank-3, as run 615, with forecast_lookback and FinanceBench fiscal labels (no_year = "latest" left off: it dropped the gold filing for all 8 no-period questions, run 695).
name = "p2-02-scope-lookback-fblabels-retrieval"
