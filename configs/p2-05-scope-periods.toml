# PR 7 ladder step 2 (full run): run 638 (structured@1 + rules scope + rerank-3) plus P2 PR 2's
# scope period options (forecast_lookback, FinanceBench fiscal labels) and answer@3 (period-end
# excerpt headers). No router.
name = "p2-05-scope-periods"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"
forecast_lookback = 1
fiscal_labels = "financebench"

[generation]
backend = "claude-cli"
model = "claude-sonnet-5-5"
prompt = "answer@3"

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
