# P3 PR 6 smoke: the P2-best pipeline with a different answering model, 5 questions
# (--only). Not a result: PR 7 runs the full comparison.
name = "p3-smoke-qwen"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"
forecast_lookback = 1
fiscal_labels = "financebench"

[router]
mode = "rules"

[generation]
backend = "openai-compatible"
model = "Qwen/Qwen3.6-27B"   # whatever `vllm serve --served-model-name` is called on the pod
prompt = "answer@4"
base_url = "http://127.0.0.1:8000/v1"   # a tunnel to the pod, `lab up --serve vllm`
api_key_env = "VLLM_API_KEY"            # unset: no key is sent
gpu_usd_per_hour = 0.0                  # SET to the pod's rate from `lab status` before a real run
max_tokens = 8000
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
