# P3 PR 6 smoke: the P2-best pipeline with a different answering model, 5 questions
# (--limit 5). Not a result: PR 7 runs the full comparison.
name = "p3-smoke-qwen"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"
forecast_lookback = 1
fiscal_labels = "financebench"

[router]
mode = "rules"

[generation]
backend = "openai-compatible"
# The served name: `lab up --serve vllm` serves the HF id's basename. 4-bit AWQ build of
# Qwen/Qwen3.6-27B (18.7 GB of weights, so it needs the pod's container disk, VLLM_DOWNLOAD_DIR=/root/hf).
model = "Qwen3.6-27B-AWQ-4bit"
prompt = "answer@4"
base_url = "http://open-model-lab:8000/v1"   # the pod on the tailnet
gpu_usd_per_hour = 0.89                      # RTX 4090, RunPod Secure Cloud, 2026-11-02
max_tokens = 4000
extra_body = { chat_template_kwargs = { enable_thinking = false } }

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
