# Retrieval-only: table-preserving@1, rules scope, vector top 50 reranked by rerank-3.
name = "p1-04-tables-rules-rerank-retrieval"
pipeline = "table-preserving@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"
