# The public deployment (P4): run 846's pipeline exactly (configs/p2-04-router-rules-facts.toml:
# structured@1, rules scope, rerank-3 over 50, rules router, answer@4) with the answer model on
# the Anthropic API instead of claude-cli. Only [generation] is replaced; [serve] is how the app
# runs and is not part of the config hash.
base = "configs/p2-04-router-rules-facts.toml"

[generation]
backend = "anthropic-api"
model = "claude-sonnet-5-5"
prompt = "answer@4"

[serve]
max_question_chars = 500
refuse_unscoped = true   # a question naming no covered company gets a refusal, no model call
rate_per_ip_hour = 10    # accepted questions per client per rolling hour
daily_cap_usd = 3.0      # API-equivalent spend per UTC day (generation + embedding + rerank)
reserve_usd = 0.06       # held per question until its real cost is known (~3x a typical answer)
max_concurrency = 3      # questions worked on at once
busy_wait_s = 30.0       # how long a request waits for a free slot before "busy"
