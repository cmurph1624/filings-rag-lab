# Retrieval-only: p1-00 (naive, fb-distractors@1) plus oracle query scoping.
# Upper bound: search only the question's own filing. Never a headline number.
name = "p1-01-scope-oracle-retrieval"
pipeline = "naive-fixed@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
search = "exact"

[retriever.scope]
mode = "oracle"
