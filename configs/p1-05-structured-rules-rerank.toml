# PR 8 ladder (full run): structured@1 + rules scope + rerank-3 (answer@1, for comparability).
name = "p1-05-structured-rules-rerank"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"

[generation]
backend = "claude-cli"
model = "claude-sonnet-5-5"
prompt = "answer@1"

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
