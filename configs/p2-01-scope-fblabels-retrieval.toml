# Retrieval-only (P2 PR 2): structured@1 + rules scope + rerank-3, as run 615, with FinanceBench fiscal labels for distractors (Ulta +1).
name = "p2-01-scope-fblabels-retrieval"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }

[retriever.scope]
mode = "rules"
fiscal_labels = "financebench"
