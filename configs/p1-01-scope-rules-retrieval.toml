# Retrieval-only: p1-00 (naive, fb-distractors@1) plus rules query scoping.
# Company from names/aliases/tickers, fiscal years and quarters from regexes.
name = "p1-01-scope-rules-retrieval"
pipeline = "naive-fixed@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
search = "exact"

[retriever.scope]
mode = "rules"
