# PR 7 ladder step 4 (full run): step 3 (p2-04-router-rules-facts: scope period options, rules
# router, answer@4 facts) plus decomposed retrieval, merged by reranker score (P2 PR 6).
name = "p2-07-decompose-facts"
pipeline = "structured@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
rerank = { model = "rerank-3", candidates = 50 }
decompose = true
decompose_merge = "score"

[retriever.scope]
mode = "rules"
forecast_lookback = 1
fiscal_labels = "financebench"

[router]
mode = "rules"

[generation]
backend = "claude-cli"
model = "claude-sonnet-5-5"
prompt = "answer@4"

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
