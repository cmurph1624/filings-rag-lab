# PR 8 ladder (full run): naive + rules scope.
name = "p1-01-scope-rules"
pipeline = "naive-fixed@1"
questions = "financebench-open"
corpus = "fb-distractors@1"

[retriever]
kind = "vector"
k = 10
search = "exact"

[retriever.scope]
mode = "rules"

[generation]
backend = "claude-cli"
model = "claude-sonnet-5-5"
prompt = "answer@1"

[judge]  # stronger than the generator, pinned per run
backend = "claude-cli"
model = "claude-opus-5-5"
prompt = "judge@1"

[execution]  # not part of the config hash
concurrency = 2
max_consecutive_failures = 5
