[project]
name = "filings-rag"
version = "0.1.0"
description = "Retrieval research harness over SEC EDGAR filings, scored against FinanceBench"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
]

[project.scripts]
frl = "filings_rag.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filings_rag"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs a running Postgres (DATABASE_URL)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
