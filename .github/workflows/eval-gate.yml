# Retrieval gate (P3 PR 4): `frl gate` on the self-hosted runner (the Nucbox) against the
# frl_ci database, for PRs that touch retrieval. The verdict is posted as a PR comment.
name: eval-gate
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/filings_rag/ingest/**"
      - "src/filings_rag/retrieve/**"
      - "src/filings_rag/embed/**"
      - "src/filings_rag/rerank/**"
      - "src/filings_rag/route/**"
      - "src/filings_rag/facts/**"
      - "src/filings_rag/harness/**"
      - "src/filings_rag/extract/**"
      - "src/filings_rag/cache.py"
      - "src/filings_rag/corpora.py"
      - "src/filings_rag/eval/gate.py"
      - "src/filings_rag/eval/retrieval.py"
      - "config/**"
      - "configs/**"
      - "corpus/**"
      - "migrations/**"
      - "scripts/ci_gate.sh"
      - ".github/workflows/eval-gate.yml"

concurrency:
  group: eval-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    # PR code runs on the Nucbox, which holds the Voyage key and the frl_ci database: only
    # same-repo PRs from people with write access, never forks.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'),
               github.event.pull_request.author_association)
    runs-on: [self-hosted, nucbox, frl]
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieval gate
        run: scripts/ci_gate.sh "${{ github.event.pull_request.base.sha }}" "$RUNNER_TEMP/verdict.md"
      - name: Post the verdict on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          f="$RUNNER_TEMP/verdict.md"
          [ -s "$f" ] || echo "## Retrieval gate: ERROR — no verdict; see the job log." > "$f"
          printf '\n_Gate for %s, [job log](%s/%s/actions/runs/%s)._\n' "${SHA:0:7}" \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> "$f"
          # Update this gate's own comment (the bot's, with its marker), never any other comment.
          marker='<!-- frl-eval-gate -->'
          echo "$marker" >> "$f"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\"))))
                  | last | .id // empty" | tail -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$f" > /dev/null
          else
            gh pr comment "$PR" --body-file "$f"
          fi
