# List prices in USD per million tokens. Every run is costed from this table, including
# claude-cli (subscription) runs, so subscription and API runs compare on one axis.
# Update deliberately: a price change moves every cost figure computed afterwards.
# Source: platform.claude.com/docs/en/about-claude/pricing (fetched 2026-10-29); Voyage pricing
# page (docs.voyageai.com/docs/pricing, fetched 2026-10-29).
as_of = "2026-10-29"
# Batch API: 50% off input and output; stacks with the cache multipliers.
batch_discount = 0.5

[models.claude-opus-5-5]
input = 4.00
output = 20.00          # thinking tokens bill as output
cache_read = 0.20       # 0.05x input; also confirmed against claude -p reported cost
cache_write = 5.00      # 5-minute cache write, 1.25x input
cache_write_1h = 8.00   # 1-hour cache write, 2x input (matches claude -p reported cost)

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.10       # 0.05x input
cache_write = 2.50
cache_write_1h = 4.00

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125
cache_write_1h = 0.20
# Prompts over 100K tokens bill at the long-context rate; cache rates scale by long_input/input.
long_context_threshold = 100_000
long_input = 0.50
long_output = 2.50

# OpenAI: developers.openai.com/api/docs/pricing (fetched 2026-11-02), standard tier, prompts up
# to 272K tokens. Cached input is a discount only; there is no cache-write charge. The API
# answers with a dated snapshot name, which is priced as this entry (`pricing.price_key`).
[models."gpt-6.1-sol"]
input = 2.00
output = 10.00
cache_read = 0.10

# Self-hosted open model (Apache-2.0, huggingface.co/Qwen/Qwen3.6-27B, fetched 2026-11-02).
# There is no token price: the token views cost it at $0 and the report's GPU-hour view
# (`gpu_usd_per_hour` in the run's [generation] times the run's wall time) is its cost.
[models."Qwen/Qwen3.6-27B"]
input = 0.0
output = 0.0

# The 4-bit build served in the P3 smoke run, under its served name.
[models."Qwen3.6-27B-AWQ-4bit"]
input = 0.0
output = 0.0

[embeddings.voyage-finance-2]
input = 0.12            # first 50M tokens per account are free; we still price at list

# Rerankers, per million tokens (query + documents, as the API's usage reports). Voyage's page
# also lists free tokens for some models; we price at list.
[rerankers.rerank-3]
input = 0.05

[rerankers.rerank-3-lite]
input = 0.02
