# List prices in USD per million tokens. Every run is costed from this table, including
# claude-cli (subscription) runs, so subscription and API runs compare on one axis.
# Update deliberately: a price change moves every cost figure computed afterwards.
# Source: Anthropic model table (claude-api skill, cached 2026-10-06); Voyage pricing page
# (docs.voyageai.com/docs/pricing, fetched 2026-10-29).
as_of = "2026-10-29"

[models.claude-opus-5-5]
input = 4.00
output = 20.00          # thinking tokens bill as output
cache_read = 0.20
cache_write = 5.00      # derived: 5-minute cache write = 1.25x input
cache_write_1h = 8.00   # derived: 1-hour cache write = 2x input (matches claude -p reported cost)

[models.claude-sonnet-5-5]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50      # derived: 1.25x input
cache_write_1h = 4.00   # derived: 2x input

[models.claude-haiku-5-5]
input = 0.10
output = 0.50
cache_read = 0.01       # derived: 0.1x input (not in the source table)
cache_write = 0.125     # derived: 1.25x input
cache_write_1h = 0.20    # derived: 2x input
# Prompts over 100K tokens bill at the long-context rate.
long_context_threshold = 100_000
long_input = 0.50
long_output = 2.50

[embeddings.voyage-finance-2]
input = 0.12            # first 50M tokens per account are free; we still price at list
